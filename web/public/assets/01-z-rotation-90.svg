<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500">
  <defs>
    <marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#dc4f42"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#24945c"/></marker>
    <marker id="gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#89928e"/></marker>
  </defs>
  <rect width="960" height="500" rx="22" fill="#f8faf8"/>
  <text x="34" y="43" font-family="sans-serif" font-size="23" font-weight="700" fill="#17201d">B 系相对 A 系绕 +z 旋转 90°</text>
  <text x="34" y="72" font-family="sans-serif" font-size="14" fill="#69726e">按右手定则：从 +z 方向看向原点，正角度为逆时针。</text>

  <!-- origin and A frame -->
  <circle cx="315" cy="318" r="7" fill="#17201d"/>
  <line x1="315" y1="318" x2="540" y2="318" stroke="#dc4f42" stroke-width="4" opacity=".35" marker-end="url(#r)"/>
  <line x1="315" y1="318" x2="315" y2="96" stroke="#24945c" stroke-width="4" opacity=".35" marker-end="url(#g)"/>
  <text x="550" y="326" font-family="sans-serif" font-size="18" fill="#b84035">x_A</text>
  <text x="288" y="92" font-family="sans-serif" font-size="18" fill="#177a48">y_A</text>

  <!-- B frame after rotation, slightly offset for visibility -->
  <line x1="327" y1="310" x2="327" y2="112" stroke="#dc4f42" stroke-width="6" marker-end="url(#r)"/>
  <line x1="307" y1="306" x2="106" y2="306" stroke="#24945c" stroke-width="6" marker-end="url(#g)"/>
  <text x="341" y="120" font-family="sans-serif" font-size="19" font-weight="700" fill="#b84035">x_B → +y_A</text>
  <text x="98" y="288" font-family="sans-serif" font-size="19" font-weight="700" fill="#177a48">y_B → −x_A</text>

  <!-- z out of page -->
  <circle cx="315" cy="318" r="25" fill="#fff" stroke="#3568d4" stroke-width="3"/>
  <circle cx="315" cy="318" r="6" fill="#3568d4"/>
  <text x="342" y="352" font-family="sans-serif" font-size="17" fill="#2859bd">z_B = z_A（朝向屏幕外）</text>

  <!-- rotation arc -->
  <path d="M432 318 A117 117 0 0 0 315 201" fill="none" stroke="#89928e" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#gray)"/>
  <text x="395" y="238" font-family="sans-serif" font-size="18" fill="#69726e">+90°</text>

  <!-- columns panel -->
  <rect x="590" y="98" width="334" height="342" rx="18" fill="#fff" stroke="#d9dfda" stroke-width="2"/>
  <text x="620" y="136" font-family="sans-serif" font-size="17" font-weight="700" fill="#17201d">依次写出 B 的三个轴在 A 中的坐标</text>
  <circle cx="624" cy="174" r="6" fill="#dc4f42"/><text x="640" y="181" font-family="serif" font-size="20" fill="#17201d">x_B in A = ( 0,  1, 0 )</text>
  <circle cx="624" cy="216" r="6" fill="#24945c"/><text x="640" y="223" font-family="serif" font-size="20" fill="#17201d">y_B in A = (−1,  0, 0 )</text>
  <circle cx="624" cy="258" r="6" fill="#3568d4"/><text x="640" y="265" font-family="serif" font-size="20" fill="#17201d">z_B in A = ( 0,  0, 1 )</text>
  <line x1="620" y1="286" x2="894" y2="286" stroke="#d9dfda"/>
  <text x="620" y="320" font-family="sans-serif" font-size="15" fill="#69726e">把三个坐标作为第 1、2、3 列：</text>
  <text x="620" y="370" font-family="serif" font-size="23" fill="#17201d">R(A←B) =</text>
  <text x="760" y="350" font-family="monospace" font-size="21" fill="#17201d">[ 0 −1 0 ]</text>
  <text x="760" y="384" font-family="monospace" font-size="21" fill="#17201d">[ 1  0 0 ]</text>
  <text x="760" y="418" font-family="monospace" font-size="21" fill="#17201d">[ 0  0 1 ]</text>
</svg>
