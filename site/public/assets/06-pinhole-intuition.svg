<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="context-stroke"/></marker></defs><rect width="1180" height="620" rx="24" fill="#f8faf8"/><text x="40" y="48" font-family="Microsoft YaHei UI,sans-serif" font-size="25" font-weight="700" fill="#17201d">针孔相机只做一件事：让每个空间点沿一条光线落到成像平面</text><text x="40" y="79" font-family="Microsoft YaHei UI,sans-serif" font-size="16" fill="#69726e">真实暗箱的像落在针孔后方并上下颠倒；计算机把等价的虚拟成像平面放到前方，公式更直观，物理光线没有改变。</text><rect x="35" y="112" width="535" height="420" rx="18" fill="#fff" stroke="#d9dfda"/><text x="302" y="149" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="18" font-weight="700" fill="#17201d">真实暗箱：后方倒像</text><line x1="115" y1="415" x2="115" y2="225" stroke="#24945c" stroke-width="8" marker-end="url(#a)"/><text x="88" y="448" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#176b52">物体</text><rect x="337" y="182" width="175" height="270" rx="8" fill="#eef3fb" stroke="#3568d4" stroke-width="3"/><circle cx="337" cy="317" r="7" fill="#17201d"/><line x1="115" y1="225" x2="337" y2="317" stroke="#c97826" stroke-width="2.5"/><line x1="337" y1="317" x2="500" y2="405" stroke="#c97826" stroke-width="2.5"/><line x1="115" y1="415" x2="337" y2="317" stroke="#7b61c8" stroke-width="2.5"/><line x1="337" y1="317" x2="500" y2="235" stroke="#7b61c8" stroke-width="2.5"/><line x1="500" y1="235" x2="500" y2="405" stroke="#dc4f42" stroke-width="7"/><text x="424" y="478" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="14" fill="#505a56">光线穿过同一个小孔，后方图像倒置</text><rect x="610" y="112" width="535" height="420" rx="18" fill="#fff" stroke="#d9dfda"/><text x="877" y="149" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="18" font-weight="700" fill="#17201d">计算模型：前方虚拟平面</text><circle cx="695" cy="330" r="9" fill="#17201d"/><text x="680" y="359" font-family="Microsoft YaHei UI,sans-serif" font-size="14" fill="#505a56">光心 O</text><line x1="695" y1="330" x2="1080" y2="330" stroke="#3568d4" stroke-width="3" marker-end="url(#a)"/><text x="1070" y="353" font-family="Cambria Math,serif" font-size="18" fill="#2859bd">z</text><line x1="845" y1="190" x2="845" y2="470" stroke="#dc4f42" stroke-width="6"/><text x="845" y="493" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="14" fill="#b84035">虚拟成像平面 z=f</text><circle cx="1050" cy="205" r="10" fill="#7b61c8"/><text x="1063" y="201" font-family="Cambria Math,serif" font-size="18" fill="#694aad">P</text><line x1="695" y1="330" x2="1050" y2="205" stroke="#7b61c8" stroke-width="3"/><circle cx="845" cy="277" r="9" fill="#c97826"/><text x="858" y="272" font-family="Microsoft YaHei UI,sans-serif" font-size="14" fill="#995b1d">投影点</text><path d="M695 330L845 277" stroke="#c97826" stroke-width="5"/><text x="877" y="510" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="14" fill="#505a56">只是把同一条射线与前方平面求交，不是移动物体</text><text x="590" y="586" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#69726e">后续公式统一使用前方虚拟成像平面，因此图像坐标不需要额外负号。</text></svg>