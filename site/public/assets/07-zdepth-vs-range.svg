<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560"><rect width="1180" height="560" rx="24" fill="#f8faf8"/><text x="40" y="48" font-family="Microsoft YaHei UI,sans-serif" font-size="25" font-weight="700" fill="#17201d">z-depth 与 range：中心像素相同，边缘像素不同</text><text x="40" y="79" font-family="Microsoft YaHei UI,sans-serif" font-size="16" fill="#69726e">z-depth 是沿光轴的前向分量 Z；range 是从光心沿斜射线到点的欧氏距离。</text><rect x="35" y="115" width="535" height="370" rx="18" fill="#fff" stroke="#d9dfda"/><text x="302" y="153" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="19" font-weight="700" fill="#17201d">z-depth = 2.0 m</text><circle cx="105" cy="405" r="9" fill="#17201d"/><line x1="105" y1="405" x2="500" y2="405" stroke="#3568d4" stroke-width="3"/><line x1="105" y1="405" x2="500" y2="207" stroke="#7b61c8" stroke-width="3"/><circle cx="500" cy="207" r="11" fill="#7b61c8"/><line x1="500" y1="207" x2="500" y2="405" stroke="#24945c" stroke-width="5"/><text x="510" y="310" font-family="Cambria Math,serif" font-size="18" fill="#176b52">Z=2.0 m</text><text x="286" y="284" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#694aad">range=√(1²+2²)=2.236 m</text><text x="302" y="458" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="14" fill="#505a56">射线方向 (X/Z,Y/Z,1)=(0.5,0,1)</text><rect x="610" y="115" width="535" height="370" rx="18" fill="#fff" stroke="#d9dfda"/><text x="877" y="153" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="19" font-weight="700" fill="#17201d">range = 2.0 m</text><circle cx="680" cy="405" r="9" fill="#17201d"/><line x1="680" y1="405" x2="1080" y2="405" stroke="#3568d4" stroke-width="3"/><line x1="680" y1="405" x2="1038" y2="226" stroke="#7b61c8" stroke-width="5"/><circle cx="1038" cy="226" r="11" fill="#7b61c8"/><line x1="1038" y1="226" x2="1038" y2="405" stroke="#c97826" stroke-width="4"/><text x="1046" y="318" font-family="Cambria Math,serif" font-size="18" fill="#995b1d">Z=1.789 m</text><text x="850" y="274" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#694aad">斜边固定为 2.0 m</text><text x="877" y="458" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="14" fill="#505a56">先把射线单位化，再乘 range</text><text x="590" y="535" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#69726e">读取传感器文档确认定义；把 range 当 Z 会让图像边缘点沿光轴放得过远。</text></svg>