<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520"><rect width="1180" height="520" rx="24" fill="#f8faf8"/><text x="40" y="48" font-family="Microsoft YaHei UI,sans-serif" font-size="25" font-weight="700" fill="#17201d">先保留有组织结构做像素对应，再用 valid mask 过滤成 N×3</text><text x="40" y="79" font-family="Microsoft YaHei UI,sans-serif" font-size="16" fill="#69726e">0、NaN、负值或超量程深度不是“距离为零的真实表面”，而是缺测值。</text><rect x="40" y="125" width="290" height="300" rx="16" fill="#fff" stroke="#d9dfda"/><text x="185" y="162" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="18" font-weight="700" fill="#17201d">深度 H×W</text><g font-family="Cascadia Code,monospace" font-size="18" text-anchor="middle"><rect x="90" y="205" width="190" height="150" fill="#eef3fb" stroke="#3568d4"/><path d="M153 205V355M216 205V355M90 280H280" stroke="#9db3df"/><text x="121" y="250">1.1</text><text x="185" y="250" fill="#dc4f42">0</text><text x="248" y="250">1.3</text><text x="121" y="325">1.0</text><text x="185" y="325" fill="#dc4f42">NaN</text><text x="248" y="325">1.2</text></g><text x="185" y="396" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="14" fill="#505a56">保留原像素位置</text><path d="M350 275H465" stroke="#7b61c8" stroke-width="4"/><path d="M450 263l20 12-20 12Z" fill="#7b61c8"/><rect x="490" y="125" width="300" height="300" rx="16" fill="#fff" stroke="#d9dfda"/><text x="640" y="162" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="18" font-weight="700" fill="#17201d">有组织点云 H×W×3</text><g fill="#3568d4"><circle cx="565" cy="235" r="9"/><circle cx="710" cy="220" r="9"/><circle cx="550" cy="345" r="9"/><circle cx="720" cy="335" r="9"/></g><g stroke="#dc4f42" stroke-width="4"><path d="M625 215l28 28M653 215l-28 28"/><path d="M625 315l28 28M653 315l-28 28"/></g><text x="640" y="396" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="14" fill="#505a56">无效位置保留 NaN + mask</text><path d="M810 275H915" stroke="#24945c" stroke-width="4"/><path d="M900 263l20 12-20 12Z" fill="#24945c"/><rect x="940" y="125" width="205" height="300" rx="16" fill="#fff" stroke="#d9dfda"/><text x="1042" y="162" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="18" font-weight="700" fill="#17201d">过滤后 N×3</text><g font-family="Cascadia Code,monospace" font-size="15" fill="#176b52"><text x="970" y="220">[X₀,Y₀,Z₀]</text><text x="970" y="263">[X₁,Y₁,Z₁]</text><text x="970" y="306">[X₂,Y₂,Z₂]</text><text x="970" y="349">[X₃,Y₃,Z₃]</text></g><text x="1042" y="396" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="14" fill="#505a56">适合几何算法</text><text x="590" y="490" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#69726e">若要给点云附 RGB 颜色，过滤点和颜色必须使用完全相同的 mask 与顺序。</text></svg>