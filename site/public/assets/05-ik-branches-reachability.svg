<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620"><rect width="1180" height="620" rx="24" fill="#f8faf8"/><text x="40" y="48" font-family="Microsoft YaHei UI,sans-serif" font-size="25" font-weight="700" fill="#17201d">逆运动学先问可达，再从多组关节解中选择</text><text x="40" y="79" font-family="Microsoft YaHei UI,sans-serif" font-size="16" fill="#69726e">平面 2R 的位置工作空间是圆环：|l₁−l₂| ≤ r ≤ l₁+l₂；圆环内部通常有肘上、肘下两支。</text><rect x="35" y="112" width="600" height="450" rx="18" fill="#fff" stroke="#d9dfda"/><circle cx="300" cy="350" r="190" fill="#eef3fb" stroke="#3568d4" stroke-width="3"/><circle cx="300" cy="350" r="32" fill="#fff" stroke="#dc4f42" stroke-width="3"/><circle cx="300" cy="350" r="7" fill="#17201d"/><text x="300" y="145" text-anchor="middle" font-family="Cambria Math,serif" font-size="18" fill="#2859bd">rₘₐₓ=l₁+l₂</text><text x="300" y="310" text-anchor="middle" font-family="Cambria Math,serif" font-size="17" fill="#b84035">rₘᵢₙ=|l₁−l₂|</text><circle cx="445" cy="292" r="10" fill="#7b61c8"/><text x="460" y="287" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#694aad">可达目标</text><circle cx="540" cy="188" r="9" fill="#dc4f42"/><text x="550" y="183" font-family="Microsoft YaHei UI,sans-serif" font-size="14" fill="#b84035">太远</text><circle cx="310" cy="348" r="7" fill="#dc4f42"/><text x="331" y="349" font-family="Microsoft YaHei UI,sans-serif" font-size="14" fill="#b84035">太近</text><text x="300" y="530" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#505a56">到目标距离 r=√(x²+y²)，不是只检查 x 或 y。</text><rect x="665" y="112" width="480" height="450" rx="18" fill="#fff" stroke="#d9dfda"/><text x="905" y="151" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="19" font-weight="700" fill="#17201d">同一个目标，两组关节角</text><circle cx="740" cy="430" r="8" fill="#17201d"/><circle cx="1038" cy="275" r="11" fill="#7b61c8"/><line x1="740" y1="430" x2="856" y2="220" stroke="#3568d4" stroke-width="14" stroke-linecap="round"/><line x1="856" y1="220" x2="1038" y2="275" stroke="#c97826" stroke-width="14" stroke-linecap="round"/><circle cx="856" cy="220" r="10" fill="#17201d"/><text x="865" y="199" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#2859bd">肘上：q₂&lt;0</text><line x1="740" y1="430" x2="908" y2="464" stroke="#24945c" stroke-width="11" stroke-linecap="round" opacity=".82"/><line x1="908" y1="464" x2="1038" y2="275" stroke="#7b61c8" stroke-width="11" stroke-linecap="round" opacity=".82"/><circle cx="908" cy="464" r="9" fill="#17201d"/><text x="919" y="489" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#176b52">肘下：q₂&gt;0</text><rect x="705" y="520" width="400" height="28" rx="7" fill="#fff4e8"/><text x="905" y="540" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="14" fill="#995b1d">还需结合关节限位、碰撞和连续性选解</text><text x="590" y="600" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#69726e">“存在数学解”不等于“机器人可以安全执行”。</text></svg>