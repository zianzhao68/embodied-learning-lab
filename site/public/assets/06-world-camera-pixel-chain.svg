<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="context-stroke"/></marker></defs><rect width="1180" height="500" rx="24" fill="#f8faf8"/><text x="40" y="48" font-family="Microsoft YaHei UI,sans-serif" font-size="25" font-weight="700" fill="#17201d">完整流水线：先用外参换到相机坐标，再用内参落到像素</text><text x="40" y="79" font-family="Microsoft YaHei UI,sans-serif" font-size="16" fill="#69726e">外参描述相机在世界中的位置和朝向；内参描述相机内部怎样把归一化坐标换成像素。</text><rect x="45" y="140" width="230" height="190" rx="16" fill="#fff" stroke="#d9dfda"/><text x="160" y="181" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="18" font-weight="700" fill="#17201d">世界中的点</text><text x="160" y="230" text-anchor="middle" font-family="Cambria Math,serif" font-size="21" fill="#7b61c8">p_world</text><text x="160" y="274" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="14" fill="#505a56">单位 m</text><line x1="275" y1="235" x2="445" y2="235" stroke="#3568d4" stroke-width="4" marker-end="url(#a)"/><text x="360" y="211" text-anchor="middle" font-family="Cambria Math,serif" font-size="17" fill="#2859bd">T_camera←world</text><text x="360" y="270" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="14" fill="#505a56">外参：R,t</text><rect x="455" y="140" width="270" height="190" rx="16" fill="#fff" stroke="#d9dfda"/><text x="590" y="181" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="18" font-weight="700" fill="#17201d">相机坐标</text><text x="590" y="226" text-anchor="middle" font-family="Cambria Math,serif" font-size="21" fill="#7b61c8">(X,Y,Z)</text><text x="590" y="264" text-anchor="middle" font-family="Cambria Math,serif" font-size="16" fill="#995b1d">(X/Z, Y/Z)</text><text x="590" y="295" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="14" fill="#505a56">透视除法</text><line x1="725" y1="235" x2="895" y2="235" stroke="#24945c" stroke-width="4" marker-end="url(#a)"/><text x="810" y="211" text-anchor="middle" font-family="Cambria Math,serif" font-size="18" fill="#176b52">K</text><text x="810" y="270" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="14" fill="#505a56">内参：fₓ,fᵧ,cₓ,cᵧ</text><rect x="905" y="140" width="230" height="190" rx="16" fill="#fff" stroke="#d9dfda"/><text x="1020" y="181" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="18" font-weight="700" fill="#17201d">图像像素</text><text x="1020" y="230" text-anchor="middle" font-family="Cambria Math,serif" font-size="21" fill="#7b61c8">p=(u,v)</text><text x="1020" y="274" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="14" fill="#505a56">单位 px</text><rect x="210" y="370" width="760" height="62" rx="12" fill="#eef3fb" stroke="#cbd8ef"/><text x="590" y="397" text-anchor="middle" font-family="Cambria Math,serif" font-size="20" fill="#2859bd">p_camera = R p_world + t</text><text x="590" y="421" text-anchor="middle" font-family="Cambria Math,serif" font-size="20" fill="#176b52">u=fₓX/Z+cₓ,   v=fᵧY/Z+cᵧ</text><text x="590" y="478" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#69726e">高频错误：把 camera→world 当成 world→camera，或在变换前就直接投影世界坐标。</text></svg>