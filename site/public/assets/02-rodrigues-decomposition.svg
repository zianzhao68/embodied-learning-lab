<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
  <defs>
    <marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#3568d4"/></marker>
    <marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#dc4f42"/></marker>
    <marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#24945c"/></marker>
    <marker id="orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#c97826"/></marker>
  </defs>
  <rect width="960" height="520" rx="22" fill="#f8faf8"/>
  <text x="36" y="45" font-family="sans-serif" font-size="24" font-weight="700" fill="#17201d">Rodrigues 的来源：轴向不动，垂直平面做二维旋转</text>
  <text x="36" y="75" font-family="sans-serif" font-size="15" fill="#69726e">待旋转向量 p 被拆成平行分量与垂直分量，叉乘 u×p 给出正切方向。</text>

  <rect x="32" y="105" width="420" height="370" rx="17" fill="#fff" stroke="#d9dfda"/>
  <text x="55" y="140" font-family="sans-serif" font-size="18" font-weight="700" fill="#17201d">① 先分解向量 p</text>
  <circle cx="225" cy="368" r="6" fill="#17201d"/>
  <line x1="225" y1="368" x2="225" y2="177" stroke="#3568d4" stroke-width="6" marker-end="url(#blue)"/>
  <text x="238" y="185" font-family="sans-serif" font-size="16" fill="#2859bd">旋转轴 u</text>
  <line x1="225" y1="368" x2="356" y2="213" stroke="#dc4f42" stroke-width="6" marker-end="url(#red)"/>
  <text x="360" y="215" font-family="sans-serif" font-size="16" fill="#b84035">p</text>
  <line x1="225" y1="368" x2="225" y2="213" stroke="#3568d4" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="225" y1="213" x2="356" y2="213" stroke="#24945c" stroke-width="5" marker-end="url(#green)"/>
  <text x="80" y="270" font-family="sans-serif" font-size="15" fill="#2859bd">p∥：沿 u，不旋转</text>
  <text x="248" y="202" font-family="sans-serif" font-size="15" fill="#176b52">p⊥：在垂直平面画圆</text>
  <text x="62" y="441" font-family="sans-serif" font-size="14" fill="#69726e">p = p∥ + p⊥</text>

  <rect x="508" y="105" width="420" height="370" rx="17" fill="#fff" stroke="#d9dfda"/>
  <text x="531" y="140" font-family="sans-serif" font-size="18" font-weight="700" fill="#17201d">② 在垂直平面中旋转</text>
  <circle cx="713" cy="306" r="125" fill="none" stroke="#e3e8e4" stroke-width="3"/>
  <circle cx="713" cy="306" r="6" fill="#17201d"/>
  <line x1="713" y1="306" x2="838" y2="306" stroke="#24945c" stroke-width="6" marker-end="url(#green)"/>
  <text x="780" y="293" font-family="sans-serif" font-size="16" fill="#176b52">p⊥</text>
  <line x1="713" y1="306" x2="713" y2="181" stroke="#c97826" stroke-width="6" marker-end="url(#orange)"/>
  <text x="724" y="190" font-family="sans-serif" font-size="16" fill="#995b1d">u×p（正切方向）</text>
  <line x1="713" y1="306" x2="801" y2="218" stroke="#dc4f42" stroke-width="6" marker-end="url(#red)"/>
  <text x="807" y="220" font-family="sans-serif" font-size="16" fill="#b84035">旋转后的 p⊥</text>
  <path d="M790 306 A77 77 0 0 0 768 252" fill="none" stroke="#7b8580" stroke-width="3"/>
  <text x="782" y="280" font-family="serif" font-size="22" fill="#505a56">α</text>
  <text x="544" y="444" font-family="sans-serif" font-size="14" fill="#69726e">cosα 沿 p⊥，sinα 沿 u×p。</text>
</svg>
