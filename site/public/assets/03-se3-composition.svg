<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600">
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="context-stroke"/></marker></defs>
  <rect width="1180" height="600" rx="24" fill="#f8faf8"/>
  <text x="40" y="48" font-family="Microsoft YaHei UI,sans-serif" font-size="25" font-weight="700" fill="#17201d">复合不是“平移直接相加”：先统一表达坐标系</text>
  <text x="40" y="79" font-family="Microsoft YaHei UI,sans-serif" font-size="16" fill="#69726e">C→B 的位移原本在 B 系表达，必须先由 Rᴬ_B 旋到 A 系，才能与 tᴬ_B 相加。</text>
  <rect x="34" y="112" width="1112" height="198" rx="18" fill="#fff" stroke="#d9dfda"/>
  <circle cx="170" cy="217" r="38" fill="#eef3fb" stroke="#3568d4" stroke-width="2"/><text x="170" y="224" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="23" font-weight="700" fill="#2859bd">C</text>
  <circle cx="510" cy="217" r="38" fill="#edf6f1" stroke="#24945c" stroke-width="2"/><text x="510" y="224" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="23" font-weight="700" fill="#176b52">B</text>
  <circle cx="1010" cy="217" r="38" fill="#fff4e8" stroke="#c97826" stroke-width="2"/><text x="1010" y="224" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="23" font-weight="700" fill="#995b1d">A</text>
  <line x1="218" y1="217" x2="458" y2="217" stroke="#24945c" stroke-width="4" marker-end="url(#arrow)"/><text x="338" y="194" text-anchor="middle" font-family="Cambria Math,serif" font-size="20" fill="#176b52">Tᴮ_C</text><text x="338" y="245" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#69726e">先：C 坐标 → B 坐标</text>
  <line x1="558" y1="217" x2="958" y2="217" stroke="#c97826" stroke-width="4" marker-end="url(#arrow)"/><text x="758" y="194" text-anchor="middle" font-family="Cambria Math,serif" font-size="20" fill="#995b1d">Tᴬ_B</text><text x="758" y="245" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#69726e">再：B 坐标 → A 坐标</text>
  <path d="M170 277 C360 340,810 340,1010 277" fill="none" stroke="#7b61c8" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="590" y="344" text-anchor="middle" font-family="Cambria Math,serif" font-size="20" fill="#694aad">Tᴬ_C = Tᴬ_B Tᴮ_C</text>
  <rect x="34" y="376" width="1112" height="176" rx="18" fill="#fff" stroke="#d9dfda"/>
  <text x="62" y="413" font-family="Microsoft YaHei UI,sans-serif" font-size="18" font-weight="700" fill="#17201d">展开 4×4 分块乘法</text>
  <text x="590" y="465" text-anchor="middle" font-family="Cambria Math,serif" font-size="27" fill="#17201d">[ Rᴬ_B  tᴬ_B ; 0  1 ] [ Rᴮ_C  tᴮ_C ; 0  1 ] = [ Rᴬ_B Rᴮ_C   Rᴬ_B tᴮ_C + tᴬ_B ; 0  1 ]</text>
  <rect x="211" y="500" width="275" height="33" rx="8" fill="#eef3fb"/><text x="348" y="523" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#2859bd">旋转复合：右侧先作用</text>
  <rect x="646" y="500" width="350" height="33" rx="8" fill="#edf6f1"/><text x="821" y="523" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#176b52">平移复合：先旋转 tᴮ_C，再加 tᴬ_B</text>
  <text x="590" y="580" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#69726e">上下标像单位一样消去：A←B · B←C = A←C</text>
</svg>