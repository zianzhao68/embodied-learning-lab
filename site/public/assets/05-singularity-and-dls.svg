<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="context-stroke"/></marker></defs><rect width="1200" height="620" rx="24" fill="#f8faf8"/><text x="40" y="48" font-family="Microsoft YaHei UI,sans-serif" font-size="25" font-weight="700" fill="#17201d">奇异点：不是机械臂锁死，而是瞬时速度方向降维</text><text x="40" y="79" font-family="Microsoft YaHei UI,sans-serif" font-size="16" fill="#69726e">平面 2R 在 q₂=0 或 π 时两根连杆共线，Jacobian 两列共线，无法瞬时生成径向速度。</text><rect x="35" y="112" width="530" height="365" rx="18" fill="#fff" stroke="#d9dfda"/><text x="300" y="150" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="19" font-weight="700" fill="#b84035">触发：q₂=0，两根连杆伸直</text><line x1="100" y1="315" x2="310" y2="315" stroke="#3568d4" stroke-width="15" stroke-linecap="round"/><line x1="310" y1="315" x2="470" y2="315" stroke="#c97826" stroke-width="15" stroke-linecap="round"/><circle cx="100" cy="315" r="10" fill="#17201d"/><circle cx="310" cy="315" r="10" fill="#17201d"/><circle cx="470" cy="315" r="11" fill="#7b61c8"/><line x1="470" y1="315" x2="470" y2="205" stroke="#24945c" stroke-width="5" marker-end="url(#a)"/><text x="485" y="217" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#176b52">仍可产生切向速度</text><line x1="470" y1="315" x2="535" y2="315" stroke="#dc4f42" stroke-width="5" stroke-dasharray="7 5"/><path d="M500 294l22 42M522 294l-22 42" stroke="#dc4f42" stroke-width="4"/><text x="352" y="382" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#b84035">不能瞬时继续沿径向伸长</text><text x="300" y="440" text-anchor="middle" font-family="Cambria Math,serif" font-size="20" fill="#505a56">J = [ 0  0 ; l₁+l₂  l₂ ]，rank=1</text><rect x="595" y="112" width="570" height="365" rx="18" fill="#fff" stroke="#d9dfda"/><text x="880" y="150" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="19" font-weight="700" fill="#176b52">反例：q₂=90°，两列不共线</text><line x1="670" y1="390" x2="860" y2="390" stroke="#3568d4" stroke-width="15" stroke-linecap="round"/><line x1="860" y1="390" x2="860" y2="220" stroke="#c97826" stroke-width="15" stroke-linecap="round"/><circle cx="670" cy="390" r="10" fill="#17201d"/><circle cx="860" cy="390" r="10" fill="#17201d"/><circle cx="860" cy="220" r="11" fill="#7b61c8"/><line x1="860" y1="220" x2="750" y2="180" stroke="#3568d4" stroke-width="5" marker-end="url(#a)"/><line x1="860" y1="220" x2="750" y2="220" stroke="#24945c" stroke-width="5" marker-end="url(#a)"/><ellipse cx="860" cy="220" rx="150" ry="82" fill="none" stroke="#7b61c8" stroke-width="3" stroke-dasharray="8 6"/><text x="993" y="330" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#694aad">二维速度椭圆有面积</text><text x="880" y="440" text-anchor="middle" font-family="Cambria Math,serif" font-size="20" fill="#505a56">det J = l₁l₂ sin q₂ = l₁l₂ ≠ 0</text><rect x="110" y="510" width="980" height="65" rx="13" fill="#eef3fb" stroke="#cbd8ef"/><text x="600" y="539" text-anchor="middle" font-family="Cambria Math,serif" font-size="21" fill="#2859bd">Δq = Jᵀ (J Jᵀ + λ²I)⁻¹ e</text><text x="600" y="563" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="14" fill="#505a56">阻尼 λ 防止奇异附近求逆爆炸，但不会让不可达方向凭空出现。</text><text x="600" y="606" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#69726e">诊断要同时报告最小奇异值、任务误差、关节限位与是否可达。</text></svg>