<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620"><rect width="1180" height="620" rx="24" fill="#f8faf8"/><text x="40" y="48" font-family="Microsoft YaHei UI,sans-serif" font-size="25" font-weight="700" fill="#17201d">相似三角形只比较“横向偏移 ÷ 向前距离”</text><text x="40" y="79" font-family="Microsoft YaHei UI,sans-serif" font-size="16" fill="#69726e">物点 P=(X,Z) 与投影点形成大小不同、形状相同的三角形，所以 x′/f=X/Z。</text><rect x="35" y="112" width="670" height="430" rx="18" fill="#fff" stroke="#d9dfda"/><circle cx="115" cy="410" r="9" fill="#17201d"/><text x="89" y="438" font-family="Microsoft YaHei UI,sans-serif" font-size="14" fill="#505a56">O</text><line x1="115" y1="410" x2="650" y2="410" stroke="#3568d4" stroke-width="3"/><line x1="315" y1="205" x2="315" y2="470" stroke="#dc4f42" stroke-width="5"/><circle cx="315" cy="330" r="9" fill="#c97826"/><circle cx="615" cy="210" r="11" fill="#7b61c8"/><line x1="115" y1="410" x2="615" y2="210" stroke="#7b61c8" stroke-width="3"/><line x1="315" y1="330" x2="315" y2="410" stroke="#c97826" stroke-width="4"/><line x1="615" y1="210" x2="615" y2="410" stroke="#7b61c8" stroke-width="4"/><text x="323" y="375" font-family="Cambria Math,serif" font-size="18" fill="#995b1d">x′</text><text x="623" y="315" font-family="Cambria Math,serif" font-size="18" fill="#694aad">X</text><text x="210" y="436" font-family="Cambria Math,serif" font-size="18" fill="#b84035">f</text><text x="460" y="436" font-family="Cambria Math,serif" font-size="18" fill="#2859bd">Z</text><text x="627" y="205" font-family="Cambria Math,serif" font-size="18" fill="#694aad">P</text><rect x="115" y="480" width="530" height="42" rx="8" fill="#eef3fb"/><text x="380" y="507" text-anchor="middle" font-family="Cambria Math,serif" font-size="21" fill="#2859bd">x′ / f = X / Z   ⇒   x′ = fX/Z</text><rect x="735" y="112" width="410" height="430" rx="18" fill="#fff" stroke="#d9dfda"/><text x="940" y="151" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="19" font-weight="700" fill="#17201d">一次只改一个量</text><text x="775" y="205" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#505a56">基准：X=0.10 m，Z=1.0 m，fₓ=500 px</text><rect x="770" y="230" width="340" height="66" rx="10" fill="#eef3fb"/><text x="790" y="257" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#2859bd">基准偏移：500×0.10/1.0 = 50 px</text><text x="790" y="281" font-family="Microsoft YaHei UI,sans-serif" font-size="14" fill="#505a56">若 cₓ=320，则 u=370 px</text><rect x="770" y="315" width="340" height="66" rx="10" fill="#edf6f1"/><text x="790" y="342" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#176b52">只把 X 加倍：偏移变为 100 px</text><text x="790" y="366" font-family="Microsoft YaHei UI,sans-serif" font-size="14" fill="#505a56">横向更远，图中移动量加倍</text><rect x="770" y="400" width="340" height="66" rx="10" fill="#fff4e8"/><text x="790" y="427" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#995b1d">只把 Z 加倍：偏移变为 25 px</text><text x="790" y="451" font-family="Microsoft YaHei UI,sans-serif" font-size="14" fill="#505a56">物体更远，看起来更靠近图像中心</text><text x="590" y="586" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#69726e">焦距用像素表示后，可以直接把无单位比例 X/Z 变成像素偏移。</text></svg>