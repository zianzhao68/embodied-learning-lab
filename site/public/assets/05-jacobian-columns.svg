<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="context-stroke"/></marker></defs><rect width="1180" height="610" rx="24" fill="#f8faf8"/><text x="40" y="48" font-family="Microsoft YaHei UI,sans-serif" font-size="25" font-weight="700" fill="#17201d">Jacobian 的每一列：单独转动一个关节时，末端瞬时往哪里走</text><text x="40" y="79" font-family="Microsoft YaHei UI,sans-serif" font-size="16" fill="#69726e">令另一个关节速度为 0，末端速度就是对应列乘该关节速度；两列加权相加得到总速度。</text><rect x="35" y="112" width="620" height="440" rx="18" fill="#fff" stroke="#d9dfda"/><line x1="110" y1="480" x2="360" y2="355" stroke="#3568d4" stroke-width="15" stroke-linecap="round"/><line x1="360" y1="355" x2="510" y2="190" stroke="#c97826" stroke-width="15" stroke-linecap="round"/><circle cx="110" cy="480" r="11" fill="#17201d"/><circle cx="360" cy="355" r="11" fill="#17201d"/><circle cx="510" cy="190" r="12" fill="#7b61c8"/><line x1="510" y1="190" x2="402" y2="132" stroke="#3568d4" stroke-width="5" marker-end="url(#a)"/><text x="318" y="132" font-family="Cambria Math,serif" font-size="20" fill="#2859bd">J[:,1] · q̇₁</text><line x1="510" y1="190" x2="455" y2="119" stroke="#24945c" stroke-width="5" marker-end="url(#a)"/><text x="474" y="124" font-family="Cambria Math,serif" font-size="20" fill="#176b52">J[:,2] · q̇₂</text><path d="M110 480L510 190" stroke="#3568d4" stroke-width="2" stroke-dasharray="7 6"/><path d="M360 355L510 190" stroke="#24945c" stroke-width="2" stroke-dasharray="7 6"/><text x="228" y="420" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#2859bd">关节 1 到末端的半径更长</text><text x="426" y="300" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#176b52">关节 2 只带动第二连杆</text><text x="345" y="526" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#505a56">转动产生切向速度：速度方向垂直于“关节到末端”的半径。</text><rect x="685" y="112" width="460" height="440" rx="18" fill="#fff" stroke="#d9dfda"/><text x="915" y="154" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="19" font-weight="700" fill="#17201d">从列向量到速度映射</text><text x="915" y="222" text-anchor="middle" font-family="Cambria Math,serif" font-size="25" fill="#17201d">ṗ = J(q) q̇</text><text x="915" y="278" text-anchor="middle" font-family="Cambria Math,serif" font-size="21" fill="#2859bd">ṗ = J₁ q̇₁ + J₂ q̇₂</text><line x1="745" y1="315" x2="1085" y2="315" stroke="#d9dfda"/><text x="915" y="360" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="16" fill="#505a56">J：2×2，单位 m/rad</text><text x="915" y="397" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="16" fill="#505a56">q̇：2×1，单位 rad/s</text><text x="915" y="434" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="16" fill="#505a56">ṗ：2×1，单位 m/s</text><rect x="744" y="474" width="342" height="45" rx="9" fill="#edf6f1"/><text x="915" y="503" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#176b52">Jacobian 是局部线性近似，不是新 FK</text><text x="590" y="590" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#69726e">位置由 FK 给出；Jacobian 描述当前位置附近“关节小变化如何变成末端小变化”。</text></svg>