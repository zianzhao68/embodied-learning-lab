<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="590" viewBox="0 0 1240 590"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="context-stroke"/></marker></defs><rect width="1240" height="590" rx="24" fill="#f8faf8"/><text x="40" y="48" font-family="Microsoft YaHei UI,sans-serif" font-size="25" font-weight="700" fill="#17201d">标准 DH：四个有顺序的基本动作定义相邻坐标系</text><text x="40" y="79" font-family="Microsoft YaHei UI,sans-serif" font-size="16" fill="#69726e">从 frame i−1 到 frame i：绕旧 z 转、沿旧 z 移、沿新 x 移、绕新 x 转。</text><g font-family="Microsoft YaHei UI,sans-serif" text-anchor="middle"><rect x="48" y="135" width="245" height="150" rx="17" fill="#eef3fb" stroke="#3568d4"/><text x="170" y="176" font-size="20" font-weight="700" fill="#2859bd">① Rz(θᵢ)</text><text x="170" y="214" font-size="16" fill="#505a56">绕 zᵢ₋₁ 旋转</text><text x="170" y="246" font-size="15" fill="#69726e">转动关节变量</text><rect x="348" y="135" width="245" height="150" rx="17" fill="#edf6f1" stroke="#24945c"/><text x="470" y="176" font-size="20" font-weight="700" fill="#176b52">② Tz(dᵢ)</text><text x="470" y="214" font-size="16" fill="#505a56">沿 zᵢ₋₁ 平移</text><text x="470" y="246" font-size="15" fill="#69726e">移动关节变量</text><rect x="648" y="135" width="245" height="150" rx="17" fill="#fff4e8" stroke="#c97826"/><text x="770" y="176" font-size="20" font-weight="700" fill="#995b1d">③ Tx(aᵢ)</text><text x="770" y="214" font-size="16" fill="#505a56">沿 xᵢ 平移</text><text x="770" y="246" font-size="15" fill="#69726e">两根 z 轴的公法线长度</text><rect x="948" y="135" width="245" height="150" rx="17" fill="#f4efff" stroke="#7b61c8"/><text x="1070" y="176" font-size="20" font-weight="700" fill="#694aad">④ Rx(αᵢ)</text><text x="1070" y="214" font-size="16" fill="#505a56">绕 xᵢ 旋转</text><text x="1070" y="246" font-size="15" fill="#69726e">相邻 z 轴扭转角</text></g><line x1="294" y1="210" x2="337" y2="210" stroke="#69726e" stroke-width="3" marker-end="url(#a)"/><line x1="594" y1="210" x2="637" y2="210" stroke="#69726e" stroke-width="3" marker-end="url(#a)"/><line x1="894" y1="210" x2="937" y2="210" stroke="#69726e" stroke-width="3" marker-end="url(#a)"/><rect x="48" y="337" width="1145" height="104" rx="17" fill="#fff" stroke="#d9dfda"/><text x="620" y="382" text-anchor="middle" font-family="Cambria Math,serif" font-size="27" fill="#17201d">ⁱ⁻¹Tᵢ = Rz(θᵢ) · Tz(dᵢ) · Tx(aᵢ) · Rx(αᵢ)</text><text x="620" y="417" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#69726e">矩阵从右向左作用，但该乘积整体由标准 DH 坐标系分配规则定义；不要擅自交换。</text><rect x="160" y="478" width="920" height="64" rx="13" fill="#fff0ed" stroke="#edc8c2"/><text x="620" y="507" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="17" font-weight="700" fill="#b84035">标准 DH ≠ 改进 DH（Modified DH）</text><text x="620" y="530" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="14" fill="#69726e">两者坐标系附着方式和乘法顺序不同；必须连同约定、参数表和实现一起使用。</text><text x="620" y="575" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#505a56">检查重点：每个关节轴必须是对应 z 轴，x 轴沿相邻 z 轴的公法线。</text></svg>