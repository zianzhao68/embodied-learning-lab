<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
  <defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="context-stroke"/></marker></defs>
  <rect width="1100" height="560" rx="24" fill="#f8faf8"/>
  <text x="38" y="48" font-family="Microsoft YaHei UI,sans-serif" font-size="25" font-weight="700" fill="#17201d">齐次坐标最后一位：决定平移是否作用</text>
  <text x="38" y="79" font-family="Microsoft YaHei UI,sans-serif" font-size="16" fill="#69726e">相同的前三个数字，可能表示空间中的点，也可能表示没有固定起点的方向。</text>
  <rect x="35" y="112" width="500" height="390" rx="18" fill="#fff" stroke="#d9dfda"/>
  <text x="62" y="151" font-family="Microsoft YaHei UI,sans-serif" font-size="20" font-weight="700" fill="#17201d">点：w = 1</text>
  <circle cx="164" cy="344" r="6" fill="#17201d"/><line x1="164" y1="344" x2="287" y2="248" stroke="#dc4f42" stroke-width="5" marker-end="url(#arr)"/><text x="297" y="247" font-family="Microsoft YaHei UI,sans-serif" font-size="17" fill="#b84035">p</text>
  <line x1="287" y1="248" x2="393" y2="191" stroke="#c97826" stroke-width="4" stroke-dasharray="8 5" marker-end="url(#arr)"/><text x="348" y="176" font-family="Microsoft YaHei UI,sans-serif" font-size="16" fill="#995b1d">+ t</text>
  <circle cx="393" cy="191" r="7" fill="#24945c"/><text x="405" y="196" font-family="Microsoft YaHei UI,sans-serif" font-size="17" fill="#176b52">p′ = Rp + t</text>
  <rect x="76" y="408" width="418" height="56" rx="10" fill="#edf6f1"/><text x="285" y="443" text-anchor="middle" font-family="Cambria Math,serif" font-size="22" fill="#176b52">[ R  t ; 0  1 ] [ p ; 1 ] = [ Rp+t ; 1 ]</text>
  <rect x="565" y="112" width="500" height="390" rx="18" fill="#fff" stroke="#d9dfda"/>
  <text x="592" y="151" font-family="Microsoft YaHei UI,sans-serif" font-size="20" font-weight="700" fill="#17201d">方向：w = 0</text>
  <circle cx="694" cy="344" r="6" fill="#17201d"/><line x1="694" y1="344" x2="817" y2="248" stroke="#3568d4" stroke-width="5" marker-end="url(#arr)"/><text x="827" y="247" font-family="Microsoft YaHei UI,sans-serif" font-size="17" fill="#2859bd">v</text>
  <line x1="817" y1="248" x2="923" y2="191" stroke="#c9cfcb" stroke-width="4" stroke-dasharray="8 5"/><path d="M856 210l28 28M884 210l-28 28" stroke="#dc4f42" stroke-width="4"/><text x="886" y="179" font-family="Microsoft YaHei UI,sans-serif" font-size="16" fill="#b84035">平移被 0 消掉</text>
  <line x1="694" y1="344" x2="755" y2="210" stroke="#24945c" stroke-width="5" marker-end="url(#arr)"/><text x="765" y="210" font-family="Microsoft YaHei UI,sans-serif" font-size="17" fill="#176b52">v′ = Rv</text>
  <rect x="606" y="408" width="418" height="56" rx="10" fill="#eef3fb"/><text x="815" y="443" text-anchor="middle" font-family="Cambria Math,serif" font-size="22" fill="#2859bd">[ R  t ; 0  1 ] [ v ; 0 ] = [ Rv ; 0 ]</text>
  <text x="550" y="535" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="16" font-weight="700" fill="#505a56">法向量、速度和轴方向通常是方向；空间位置、关键点和原点是点。</text>
</svg>