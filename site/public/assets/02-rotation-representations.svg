<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500">
  <defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#82908a"/></marker></defs>
  <rect width="960" height="500" rx="22" fill="#f8faf8"/>
  <text x="38" y="48" font-family="sans-serif" font-size="24" font-weight="700" fill="#17201d">同一个三维姿态，可以使用四种“语言”描述</text>
  <text x="38" y="78" font-family="sans-serif" font-size="15" fill="#69726e">它们表达的是同一件事，但适合的计算任务不同。</text>
  <circle cx="480" cy="245" r="88" fill="#17201d"/>
  <text x="480" y="232" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#fff">同一个姿态</text>
  <text x="480" y="264" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#d8dfdc">末端执行器朝向</text>
  <text x="480" y="290" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9db1a9">3 个自由度</text>
  <g stroke="#82908a" stroke-width="2.5" marker-end="url(#arr)"><line x1="405" y1="190" x2="276" y2="131"/><line x1="555" y1="190" x2="684" y2="131"/><line x1="405" y1="300" x2="276" y2="369"/><line x1="555" y1="300" x2="684" y2="369"/></g>
  <g>
    <rect x="45" y="93" width="245" height="112" rx="16" fill="#fff" stroke="#d9dfda"/><text x="68" y="126" font-family="sans-serif" font-size="18" font-weight="700" fill="#17201d">旋转矩阵 R</text><text x="68" y="155" font-family="sans-serif" font-size="14" fill="#69726e">9 个数，直接作用于向量</text><text x="68" y="181" font-family="sans-serif" font-size="13" fill="#176b52">复合、几何推导最自然</text>
    <rect x="670" y="93" width="245" height="112" rx="16" fill="#fff" stroke="#d9dfda"/><text x="693" y="126" font-family="sans-serif" font-size="18" font-weight="700" fill="#17201d">欧拉角 (roll,pitch,yaw)</text><text x="693" y="155" font-family="sans-serif" font-size="14" fill="#69726e">3 个角，顺序决定含义</text><text x="693" y="181" font-family="sans-serif" font-size="13" fill="#b26b23">适合人读，但有奇异点</text>
    <rect x="45" y="337" width="245" height="112" rx="16" fill="#fff" stroke="#d9dfda"/><text x="68" y="370" font-family="sans-serif" font-size="18" font-weight="700" fill="#17201d">轴角 (u, θ)</text><text x="68" y="399" font-family="sans-serif" font-size="14" fill="#69726e">绕单位轴 u 旋转 θ</text><text x="68" y="425" font-family="sans-serif" font-size="13" fill="#176b52">几何意义最直观</text>
    <rect x="670" y="337" width="245" height="112" rx="16" fill="#fff" stroke="#d9dfda"/><text x="693" y="370" font-family="sans-serif" font-size="18" font-weight="700" fill="#17201d">单位四元数 q</text><text x="693" y="399" font-family="sans-serif" font-size="14" fill="#69726e">4 个数，q 与 −q 等价</text><text x="693" y="425" font-family="sans-serif" font-size="13" fill="#2859bd">插值、状态传输更稳定</text>
  </g>
</svg>
