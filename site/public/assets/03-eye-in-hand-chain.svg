<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="580" viewBox="0 0 1260 580">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="context-stroke"/></marker></defs>
  <rect width="1260" height="580" rx="24" fill="#f8faf8"/>
  <text x="40" y="48" font-family="Microsoft YaHei UI,sans-serif" font-size="25" font-weight="700" fill="#17201d">眼在手上：从相机观测到机器人抓取位姿</text>
  <text x="40" y="79" font-family="Microsoft YaHei UI,sans-serif" font-size="16" fill="#69726e">每个箭头都回答“右侧坐标如何转换到左侧”；蓝色随机器人或观测更新，绿色来自离线标定/抓取模板。</text>
  <g font-family="Microsoft YaHei UI,sans-serif" text-anchor="middle">
    <rect x="46" y="161" width="174" height="90" rx="16" fill="#fff4e8" stroke="#c97826"/><text x="133" y="197" font-size="19" font-weight="700" fill="#995b1d">base</text><text x="133" y="225" font-size="14" fill="#69726e">机器人基座</text>
    <rect x="303" y="161" width="174" height="90" rx="16" fill="#eef3fb" stroke="#3568d4"/><text x="390" y="197" font-size="19" font-weight="700" fill="#2859bd">ee</text><text x="390" y="225" font-size="14" fill="#69726e">末端执行器</text>
    <rect x="560" y="161" width="174" height="90" rx="16" fill="#edf6f1" stroke="#24945c"/><text x="647" y="197" font-size="19" font-weight="700" fill="#176b52">camera</text><text x="647" y="225" font-size="14" fill="#69726e">眼在手上相机</text>
    <rect x="817" y="161" width="174" height="90" rx="16" fill="#f4efff" stroke="#7b61c8"/><text x="904" y="197" font-size="19" font-weight="700" fill="#694aad">object</text><text x="904" y="225" font-size="14" fill="#69726e">视觉检测物体</text>
    <rect x="1074" y="161" width="140" height="90" rx="16" fill="#fff0ed" stroke="#dc4f42"/><text x="1144" y="197" font-size="19" font-weight="700" fill="#b84035">grasp</text><text x="1144" y="225" font-size="14" fill="#69726e">抓取模板</text>
  </g>
  <line x1="303" y1="206" x2="230" y2="206" stroke="#3568d4" stroke-width="4" marker-end="url(#a)"/><text x="266" y="184" text-anchor="middle" font-family="Cambria Math,serif" font-size="19" fill="#2859bd">Tᵇᵃˢᵉ_ee(q,t)</text>
  <line x1="560" y1="206" x2="487" y2="206" stroke="#24945c" stroke-width="4" marker-end="url(#a)"/><text x="523" y="184" text-anchor="middle" font-family="Cambria Math,serif" font-size="19" fill="#176b52">Tᵉᵉ_camera</text>
  <line x1="817" y1="206" x2="744" y2="206" stroke="#3568d4" stroke-width="4" marker-end="url(#a)"/><text x="780" y="184" text-anchor="middle" font-family="Cambria Math,serif" font-size="19" fill="#2859bd">Tᶜᵃᵐ_object(t)</text>
  <line x1="1074" y1="206" x2="1001" y2="206" stroke="#24945c" stroke-width="4" marker-end="url(#a)"/><text x="1037" y="184" text-anchor="middle" font-family="Cambria Math,serif" font-size="19" fill="#176b52">Tᵒᵇʲ_grasp</text>
  <rect x="46" y="315" width="1168" height="102" rx="17" fill="#fff" stroke="#d9dfda"/>
  <text x="630" y="355" text-anchor="middle" font-family="Cambria Math,serif" font-size="25" fill="#17201d">Tᵇᵃˢᵉ_grasp = Tᵇᵃˢᵉ_ee · Tᵉᵉ_camera · Tᶜᵃᵐ_object · Tᵒᵇʲ_grasp</text>
  <text x="630" y="393" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="16" fill="#69726e">从右向左：抓取模板 → 物体 → 相机 → 末端 → 基座；相邻 frame 名必须配对。</text>
  <rect x="86" y="461" width="500" height="70" rx="14" fill="#eef3fb"/><circle cx="117" cy="496" r="8" fill="#3568d4"/><text x="143" y="490" font-family="Microsoft YaHei UI,sans-serif" font-size="16" font-weight="700" fill="#2859bd">动态项</text><text x="143" y="515" font-family="Microsoft YaHei UI,sans-serif" font-size="14" fill="#505a56">机器人关节状态与每帧视觉观测；必须对齐时间戳。</text>
  <rect x="674" y="461" width="500" height="70" rx="14" fill="#edf6f1"/><circle cx="705" cy="496" r="8" fill="#24945c"/><text x="731" y="490" font-family="Microsoft YaHei UI,sans-serif" font-size="16" font-weight="700" fill="#176b52">固定项</text><text x="731" y="515" font-family="Microsoft YaHei UI,sans-serif" font-size="14" fill="#505a56">手眼标定与物体抓取模板；更新标定后必须版本化。</text>
  <text x="630" y="563" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="15" font-weight="700" fill="#b84035">高频错误：把眼在手上相机当固定在 base、用错时间戳、方向取反、米/毫米混用。</text>
</svg>