<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="context-stroke"/></marker></defs><rect width="1120" height="580" rx="24" fill="#f8faf8"/><text x="38" y="48" font-family="Microsoft YaHei UI,sans-serif" font-size="25" font-weight="700" fill="#17201d">关节给自由度，连杆把运动传给下游</text><text x="38" y="79" font-family="Microsoft YaHei UI,sans-serif" font-size="16" fill="#69726e">关节变量不是末端坐标；它先改变相邻连杆关系，再通过整条变换链影响末端。</text><rect x="35" y="112" width="510" height="400" rx="18" fill="#fff" stroke="#d9dfda"/><text x="62" y="151" font-family="Microsoft YaHei UI,sans-serif" font-size="20" font-weight="700" fill="#17201d">转动关节 · Revolute joint</text><circle cx="205" cy="329" r="35" fill="#eef3fb" stroke="#3568d4" stroke-width="4"/><circle cx="205" cy="329" r="8" fill="#3568d4"/><line x1="236" y1="310" x2="407" y2="210" stroke="#c97826" stroke-width="18" stroke-linecap="round"/><circle cx="407" cy="210" r="12" fill="#c97826"/><path d="M147 330A58 58 0 0 1 189 274" fill="none" stroke="#7b61c8" stroke-width="4" marker-end="url(#a)"/><text x="118" y="265" font-family="Cambria Math,serif" font-size="22" fill="#694aad">qᵢ = θᵢ</text><text x="285" y="390" font-family="Microsoft YaHei UI,sans-serif" font-size="16" fill="#505a56">变量：角度，单位 rad</text><rect x="77" y="432" width="426" height="52" rx="10" fill="#f4efff"/><text x="290" y="465" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="16" fill="#694aad">旋转一个关节，会带动全部下游连杆</text><rect x="575" y="112" width="510" height="400" rx="18" fill="#fff" stroke="#d9dfda"/><text x="602" y="151" font-family="Microsoft YaHei UI,sans-serif" font-size="20" font-weight="700" fill="#17201d">移动关节 · Prismatic joint</text><rect x="650" y="275" width="115" height="76" rx="12" fill="#eef3fb" stroke="#3568d4" stroke-width="3"/><rect x="752" y="298" width="218" height="30" rx="12" fill="#edf6f1" stroke="#24945c" stroke-width="3"/><line x1="770" y1="250" x2="946" y2="250" stroke="#24945c" stroke-width="4" marker-end="url(#a)"/><text x="858" y="229" text-anchor="middle" font-family="Cambria Math,serif" font-size="22" fill="#176b52">qᵢ = dᵢ</text><text x="829" y="390" font-family="Microsoft YaHei UI,sans-serif" font-size="16" fill="#505a56">变量：距离，单位 m</text><rect x="617" y="432" width="426" height="52" rx="10" fill="#edf6f1"/><text x="830" y="465" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="16" fill="#176b52">沿关节轴滑动，不改变自身轴向</text><text x="560" y="550" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="16" font-weight="700" fill="#505a56">自由度（DOF）是独立关节变量的数量，不等于连杆数量，也不等于末端坐标数字个数。</text></svg>