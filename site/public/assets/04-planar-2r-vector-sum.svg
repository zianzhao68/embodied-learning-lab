<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620"><defs><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="context-stroke"/></marker></defs><rect width="1180" height="620" rx="24" fill="#f8faf8"/><text x="40" y="48" font-family="Microsoft YaHei UI,sans-serif" font-size="25" font-weight="700" fill="#17201d">平面 2R：末端位置是两根连杆向量的首尾相加</text><text x="40" y="79" font-family="Microsoft YaHei UI,sans-serif" font-size="16" fill="#69726e">q₂ 是相对第一连杆的角度，因此第二连杆相对 base 的绝对方向是 q₁+q₂。</text><rect x="35" y="112" width="580" height="450" rx="18" fill="#fff" stroke="#d9dfda"/><line x1="113" y1="482" x2="540" y2="482" stroke="#dc4f42" stroke-width="3" marker-end="url(#r)"/><line x1="113" y1="482" x2="113" y2="165" stroke="#24945c" stroke-width="3" marker-end="url(#r)"/><text x="546" y="488" font-family="sans-serif" font-size="17" fill="#b84035">x</text><text x="102" y="157" font-family="sans-serif" font-size="17" fill="#176b52">y</text><line x1="113" y1="482" x2="371" y2="333" stroke="#3568d4" stroke-width="17" stroke-linecap="round"/><line x1="371" y1="333" x2="371" y2="116" stroke="#c97826" stroke-width="17" stroke-linecap="round"/><circle cx="113" cy="482" r="12" fill="#17201d"/><circle cx="371" cy="333" r="13" fill="#17201d"/><circle cx="371" cy="116" r="13" fill="#7b61c8"/><path d="M184 482A71 71 0 0 0 174 447" fill="none" stroke="#3568d4" stroke-width="4"/><text x="186" y="447" font-family="Cambria Math,serif" font-size="21" fill="#2859bd">q₁=30°</text><path d="M326 359A52 52 0 0 1 371 281" fill="none" stroke="#c97826" stroke-width="4"/><text x="402" y="284" font-family="Cambria Math,serif" font-size="21" fill="#995b1d">q₂=60°</text><text x="238" y="384" font-family="Cambria Math,serif" font-size="20" fill="#2859bd">l₁=0.4 m</text><text x="388" y="229" font-family="Cambria Math,serif" font-size="20" fill="#995b1d">l₂=0.3 m</text><text x="386" y="108" font-family="Microsoft YaHei UI,sans-serif" font-size="16" fill="#694aad">末端 (0.346, 0.500)</text><rect x="650" y="112" width="495" height="450" rx="18" fill="#fff" stroke="#d9dfda"/><text x="678" y="153" font-family="Microsoft YaHei UI,sans-serif" font-size="19" font-weight="700" fill="#17201d">从向量和构造公式</text><text x="897" y="215" text-anchor="middle" font-family="Cambria Math,serif" font-size="23" fill="#2859bd">p₁ = l₁ [ cos q₁, sin q₁ ]ᵀ</text><text x="897" y="280" text-anchor="middle" font-family="Cambria Math,serif" font-size="23" fill="#995b1d">p₂ = l₂ [ cos(q₁+q₂), sin(q₁+q₂) ]ᵀ</text><line x1="696" y1="320" x2="1098" y2="320" stroke="#d9dfda"/><text x="897" y="369" text-anchor="middle" font-family="Cambria Math,serif" font-size="25" fill="#17201d">pₑₑ = p₁ + p₂</text><text x="897" y="427" text-anchor="middle" font-family="Cambria Math,serif" font-size="22" fill="#505a56">x = l₁cos q₁ + l₂cos(q₁+q₂)</text><text x="897" y="472" text-anchor="middle" font-family="Cambria Math,serif" font-size="22" fill="#505a56">y = l₁sin q₁ + l₂sin(q₁+q₂)</text><rect x="708" y="510" width="378" height="34" rx="8" fill="#fff4e8"/><text x="897" y="533" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#995b1d">错误反例：把第二连杆方向直接写成 q₂</text><text x="590" y="600" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#69726e">读图：先得到第一关节后的肘部位置，再从肘部沿 q₁+q₂ 方向走 l₂。</text></svg>