<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620"><defs><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="context-stroke"/></marker></defs><rect width="1180" height="620" rx="24" fill="#f8faf8"/><text x="40" y="48" font-family="Microsoft YaHei UI,sans-serif" font-size="25" font-weight="700" fill="#17201d">先分清两个坐标世界：相机坐标用米，像素坐标用格子编号</text><text x="40" y="79" font-family="Microsoft YaHei UI,sans-serif" font-size="16" fill="#69726e">OpenCV 光学坐标系：x 向右、y 向下、z 向前；图像：u 向右、v 向下，原点在左上角。</text><rect x="35" y="112" width="535" height="430" rx="18" fill="#fff" stroke="#d9dfda"/><text x="302" y="151" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="19" font-weight="700" fill="#17201d">三维相机坐标 (X,Y,Z)，单位 m</text><circle cx="180" cy="390" r="10" fill="#17201d"/><text x="145" y="422" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#505a56">光心 O</text><line x1="180" y1="390" x2="420" y2="390" stroke="#dc4f42" stroke-width="4" marker-end="url(#r)"/><text x="430" y="396" font-family="Cambria Math,serif" font-size="19" fill="#b84035">x</text><line x1="180" y1="390" x2="180" y2="500" stroke="#24945c" stroke-width="4" marker-end="url(#r)"/><text x="194" y="506" font-family="Cambria Math,serif" font-size="19" fill="#176b52">y</text><line x1="180" y1="390" x2="350" y2="220" stroke="#3568d4" stroke-width="4" marker-end="url(#r)"/><text x="359" y="215" font-family="Cambria Math,serif" font-size="19" fill="#2859bd">z</text><circle cx="420" cy="245" r="11" fill="#7b61c8"/><text x="433" y="239" font-family="Cambria Math,serif" font-size="18" fill="#694aad">P=(X,Y,Z)</text><text x="302" y="518" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="14" fill="#505a56">Z 是沿光轴的深度，不是到光心的欧氏距离</text><rect x="610" y="112" width="535" height="430" rx="18" fill="#fff" stroke="#d9dfda"/><text x="877" y="151" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="19" font-weight="700" fill="#17201d">二维像素坐标 (u,v)，单位 px</text><rect x="690" y="185" width="380" height="285" rx="5" fill="#eef3fb" stroke="#3568d4" stroke-width="3"/><line x1="690" y1="185" x2="1015" y2="185" stroke="#dc4f42" stroke-width="4" marker-end="url(#r)"/><text x="1030" y="191" font-family="Cambria Math,serif" font-size="19" fill="#b84035">u</text><line x1="690" y1="185" x2="690" y2="430" stroke="#24945c" stroke-width="4" marker-end="url(#r)"/><text x="704" y="446" font-family="Cambria Math,serif" font-size="19" fill="#176b52">v</text><text x="700" y="176" font-family="Cambria Math,serif" font-size="15" fill="#505a56">(0,0)</text><circle cx="880" cy="328" r="9" fill="#c97826"/><line x1="880" y1="185" x2="880" y2="328" stroke="#c97826" stroke-dasharray="7 5"/><line x1="690" y1="328" x2="880" y2="328" stroke="#c97826" stroke-dasharray="7 5"/><text x="893" y="322" font-family="Cambria Math,serif" font-size="17" fill="#995b1d">p=(u,v)</text><circle cx="880" cy="328" r="24" fill="none" stroke="#7b61c8" stroke-width="2"/><text x="880" y="500" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="14" fill="#505a56">像素只说明落在哪个格子，单张图不直接保存 Z</text><text x="590" y="586" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#69726e">同一个字母 x/y 不应混用：本课用大写 X,Y,Z 表示米制三维量，用 u,v 表示像素。</text></svg>