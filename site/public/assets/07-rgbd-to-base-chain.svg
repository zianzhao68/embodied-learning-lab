<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500"><rect width="1180" height="500" rx="24" fill="#f8faf8"/><text x="40" y="48" font-family="Microsoft YaHei UI,sans-serif" font-size="25" font-weight="700" fill="#17201d">RGB-D 到机器人 base：每一步都要保持分辨率、像素和坐标系一致</text><text x="40" y="79" font-family="Microsoft YaHei UI,sans-serif" font-size="16" fill="#69726e">深度对齐到 RGB 后，同一个 (u,v) 才能同时提供颜色和深度；反投影得到 camera 点，再经手眼外参到 base。</text><g font-family="Microsoft YaHei UI,sans-serif"><rect x="40" y="140" width="190" height="180" rx="15" fill="#fff" stroke="#d9dfda"/><text x="135" y="180" text-anchor="middle" font-size="18" font-weight="700">RGB 图</text><text x="135" y="222" text-anchor="middle" font-size="15" fill="#505a56">颜色 C[v,u]</text><text x="135" y="257" text-anchor="middle" font-size="14" fill="#505a56">H×W×3</text><rect x="270" y="140" width="190" height="180" rx="15" fill="#fff" stroke="#d9dfda"/><text x="365" y="180" text-anchor="middle" font-size="18" font-weight="700">深度图</text><text x="365" y="222" text-anchor="middle" font-size="15" fill="#505a56">Z=D[v,u]</text><text x="365" y="257" text-anchor="middle" font-size="14" fill="#505a56">H×W，单位 m</text><path d="M480 230H575" stroke="#7b61c8" stroke-width="4"/><path d="M560 218l20 12-20 12Z" fill="#7b61c8"/><text x="527" y="207" text-anchor="middle" font-size="14" fill="#694aad">同像素 + K</text><rect x="600" y="140" width="230" height="180" rx="15" fill="#fff" stroke="#d9dfda"/><text x="715" y="180" text-anchor="middle" font-size="18" font-weight="700">camera 点云</text><text x="715" y="222" text-anchor="middle" font-size="15" fill="#505a56">p_camera</text><text x="715" y="257" text-anchor="middle" font-size="14" fill="#505a56">H×W×3 或 N×3</text><path d="M850 230H945" stroke="#3568d4" stroke-width="4"/><path d="M930 218l20 12-20 12Z" fill="#3568d4"/><text x="897" y="207" text-anchor="middle" font-size="14" fill="#2859bd">T_base←camera</text><rect x="970" y="140" width="170" height="180" rx="15" fill="#fff" stroke="#d9dfda"/><text x="1055" y="180" text-anchor="middle" font-size="18" font-weight="700">base 点云</text><text x="1055" y="222" text-anchor="middle" font-size="15" fill="#505a56">p_base</text><text x="1055" y="257" text-anchor="middle" font-size="14" fill="#505a56">供抓取/规划</text><rect x="150" y="365" width="880" height="65" rx="12" fill="#fff4e8"/><text x="590" y="392" text-anchor="middle" font-size="15" fill="#995b1d">若图像缩放：fₓ,cₓ 随宽缩放，fᵧ,cᵧ 随高缩放；若裁剪：cₓ减 left，cᵧ减 top。</text><text x="590" y="416" text-anchor="middle" font-size="14" fill="#505a56">只改图像大小、不改 K，会让整片点云产生系统性倾斜和尺度位置误差。</text><text x="590" y="480" text-anchor="middle" font-size="15" fill="#69726e">先在 camera 系检查点云形状，再变换到 base；不要把两类错误混在一起排查。</text></g></svg>