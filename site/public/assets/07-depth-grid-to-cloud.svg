<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620"><rect width="1180" height="620" rx="24" fill="#f8faf8"/><text x="40" y="48" font-family="Microsoft YaHei UI,sans-serif" font-size="25" font-weight="700" fill="#17201d">深度图的每个有效格子，沿自己的像素射线放回三维</text><text x="40" y="79" font-family="Microsoft YaHei UI,sans-serif" font-size="16" fill="#69726e">示例内参：fₓ=fᵧ=2 px，主点 (1,1)。中心深度 2 m，其余深度 1 m。</text><rect x="40" y="125" width="430" height="405" rx="18" fill="#fff" stroke="#d9dfda"/><text x="255" y="162" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="19" font-weight="700" fill="#17201d">3×3 z-depth 图，单位 m</text><g font-family="Cascadia Code,monospace" font-size="22" text-anchor="middle"><rect x="105" y="205" width="300" height="300" fill="#eef3fb" stroke="#3568d4" stroke-width="3"/><path d="M205 205V505M305 205V505M105 305H405M105 405H405" stroke="#9db3df" stroke-width="2"/><text x="155" y="264">1.0</text><text x="255" y="264">1.0</text><text x="355" y="264">1.0</text><text x="155" y="364">1.0</text><text x="255" y="364" fill="#b84035" font-weight="700">2.0</text><text x="355" y="364">1.0</text><text x="155" y="464">1.0</text><text x="255" y="464">1.0</text><text x="355" y="464">1.0</text></g><text x="255" y="554" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="14" fill="#505a56">数组索引是 depth[v,u]，不是 depth[u,v]</text><path d="M490 325H650" stroke="#7b61c8" stroke-width="5"/><path d="M635 312l22 13-22 13Z" fill="#7b61c8"/><text x="570" y="300" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#694aad">逐像素反投影</text><rect x="680" y="125" width="460" height="405" rx="18" fill="#fff" stroke="#d9dfda"/><text x="910" y="162" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="19" font-weight="700" fill="#17201d">有组织点云 H×W×3</text><circle cx="760" cy="445" r="9" fill="#17201d"/><g stroke="#9db3df" stroke-width="2"><line x1="760" y1="445" x2="875" y2="245"/><line x1="760" y1="445" x2="910" y2="315"/><line x1="760" y1="445" x2="1000" y2="225"/><line x1="760" y1="445" x2="1060" y2="350"/></g><g fill="#3568d4"><circle cx="817" cy="345" r="8"/><circle cx="875" cy="245" r="8"/><circle cx="880" cy="380" r="8"/><circle cx="1000" cy="225" r="8"/><circle cx="1060" cy="350" r="8"/><circle cx="940" cy="420" r="8"/><circle cx="1020" cy="440" r="8"/></g><circle cx="910" cy="315" r="11" fill="#dc4f42"/><text x="925" y="307" font-family="Cambria Math,serif" font-size="17" fill="#b84035">(0,0,2)</text><text x="915" y="489" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="14" fill="#505a56">每个点仍能追溯到原来的 (v,u)</text><text x="590" y="590" text-anchor="middle" font-family="Microsoft YaHei UI,sans-serif" font-size="15" fill="#69726e">点云不是额外测量；它只是把“像素 + 深度 + 内参”改写成三维坐标。</text></svg>