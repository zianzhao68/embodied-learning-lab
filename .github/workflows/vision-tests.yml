name: Vision library tests

on:
  push:
    branches: [main]
    paths:
      - "vision-lib/**"
      - ".github/workflows/vision-tests.yml"
  pull_request:
    paths:
      - "vision-lib/**"
      - ".github/workflows/vision-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vision-lib/pyproject.toml
      - name: Install NumPy package
        run: python -m pip install -e ./vision-lib
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run camera tests
        working-directory: vision-lib
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        working-directory: vision-lib
        run: python -m compileall -q src tests
